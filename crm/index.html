<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملائم — إدارة العملاء</title>
    <link rel="icon" type="image/jpeg" href="../images/logo.jpg">

    <!-- نفس خطوط اللوحة القديمة -->
    <link
        href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">

    <!-- crm.css يستورد ../css/style.css أولاً ثم يضيف فروق /crm/ فقط -->
    <link rel="stylesheet" href="crm.css">
</head>

<body>
    <!-- تظهر حتى تُقرأ الجلسة، ثم تُخفى -->
    <div class="loading" id="bootScreen" style="padding-top:90px">جارٍ التحقق من الجلسة</div>

    <!-- شاشة الدخول: لا تظهر إلا إذا لم تكن هناك جلسة -->
    <div class="login-container crm-hidden" id="loginScreen">
        <div class="login-box">
            <img src="../images/logo.jpg" class="login-logo" alt="شعار النظام">
            <h1>نظام ملائم العقاري</h1>
            <p>إدارة العملاء</p>

            <div class="login-error crm-hidden" id="loginError"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" required placeholder="أدخل اسم المستخدم" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" required placeholder="أدخل كلمة المرور"
                        autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">دخول</button>
            </form>
        </div>
    </div>

    <!-- هيكل التطبيق -->
    <div class="app-container" id="appScreen">
        <div class="container">
            <!-- نفس ترويسة اللوحة القديمة حرفاً بحرف (css/style.css) -->
            <div class="header">
                <div class="header-content">
                    <div class="header-brand">
                        <img src="../images/logo.jpg" class="header-logo" alt="شعار النظام">
                        <div>
                            <h1>نظام ملائم العقاري</h1>
                            <p>إدارة العملاء</p>
                        </div>
                    </div>
                </div>
                <div class="user-info">
                    <span class="user-badge" id="userBadge"></span>
                    <button class="theme-toggle" id="themeToggle" type="button" aria-label="تفعيل الوضع الليلي" title="الوضع الليلي">◐</button>
                    <button class="logout-btn" id="logoutBtn" type="button">تسجيل الخروج</button>
                </div>
            </div>

            <nav class="crm-nav" id="crmNav"></nav>

            <main id="view"></main>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>
    <div class="notification" id="notification"></div>

    <!-- حارس الإقلاع: نص تقليدي (لا وحدة) يسبق كل ما سواه، حتى يلتقط فشل تحميل
         المكتبة أو الإعدادات نفسها، فلا يرى المستخدم شاشة بيضاء بلا تفسير. -->
    <script>
        (function () {
            var shown = false;
            function bootError(detail) {
                var boot = document.getElementById('bootScreen');
                // لا نلمس الشاشة بعد نجاح الإقلاع: التطبيق يخفيها بـ crm-hidden
                if (!boot || shown || boot.className.indexOf('crm-hidden') !== -1) return;
                shown = true;
                boot.className = 'crm-error';
                boot.style.cssText = 'margin:90px auto 0;max-width:640px';
                // صفحة مفتوحة من ملف على الجهاز (file://): المتصفح يمنع تحميل وحدات
                // JavaScript منها فيتوقف الإقلاع دائماً. رسالة صريحة برابط الموقع بدل config.js.
                if (location.protocol === 'file:') {
                    var site = 'https://mohammedalseari-design.github.io/mulaem-dash/crm/';
                    boot.textContent = 'هذه نسخة محفوظة على الجهاز، والمتصفح لا يشغّل النظام منها. افتح النظام من رابط الموقع: ';
                    var link = document.createElement('a');
                    link.href = site + location.hash;
                    link.textContent = site;
                    link.dir = 'ltr';
                    boot.appendChild(link);
                    return;
                }
                boot.textContent = 'تعذّر تحميل الإعدادات أو المكتبة — راجع js/config.js';
                if (detail) {
                    var line = document.createElement('div');
                    line.className = 'crm-subtle';
                    line.style.marginTop = '8px';
                    line.textContent = String(detail);
                    boot.appendChild(line);
                }
            }
            window.onerror = function (message) { bootError(message); };
            // فشل تحميل ملف (المكتبة أو config.js) لا يمرّ على onerror، بل على
            // حدث error في طور الالتقاط على النافذة
            window.addEventListener('error', function (event) {
                if (event.target && event.target !== window && event.target.src) {
                    bootError('تعذّر تحميل: ' + event.target.src);
                }
            }, true);
            window.addEventListener('unhandledrejection', function (event) {
                var reason = event.reason;
                bootError(reason && reason.message ? reason.message : reason);
            });
        })();
    </script>

    <!-- نفس شبكة التوزيع المستخدمة في اللوحة القديمة، بإصدار مثبّت لا يتغيّر تحتنا -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
    <script src="../js/config.js"></script>
    <!-- بدون supabase-shim.js وبدون script.js: هذه الصفحة تتحدث إلى Supabase مباشرة -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
