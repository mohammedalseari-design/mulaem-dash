# نشر وظيفة agent-run من المستودع نفسه: أداة Supabase ترفع ملفات main من النسخة المسحوبة كما هي، بايتاً ببايت،
# بلا نسخ يدوي للملفات الاثني عشر ولا نقل عبر محادثة.
# يبدأ فقط بدفعة إلى main تمس ما تجمعه الوظيفة، ثم ينتظر موافقة المالك في بيئة production المحمية، وفيها
# وحدها السر SUPABASE_ACCESS_TOKEN. الإعداد لمرة واحدة والتراجع وما يُفعل إن تسرّب الرمز: docs/DEPLOY.md.
name: deploy-agent-run

on:
  push:
    branches: [main]
    # ما تجمعه agent-run فعلاً: مجلدها و_shared/effort-router وحده من _shared (إن استوردت غيره فأضفه هنا وفي خطوة
    # Refuse a run older than main)، ثم الإعداد وهذا الملف
    paths:
      - 'supabase/functions/agent-run/**'
      - 'supabase/functions/_shared/effort-router/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-agent-run.yml'

permissions:
  contents: read

# نشر واحد في كل مرة، ولا يُقطع نشر بدأ
concurrency:
  group: deploy-agent-run
  cancel-in-progress: false

# bash -eo pipefail: أول أمر يفشل يُسقط الخطوة
defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.repository == 'mohammedalseari-design/mulaem-dash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # البيئة المحمية: لا يبدأ العمل قبل موافقة المالك، والسر فيها لا في أسرار المستودع
    environment: production
    timeout-minutes: 20
    env:
      PROJECT_REF: niykzsspdehexphewlxa
      # لا قياس استخدام من أداة Supabase في عمل يحمل رمز النشر
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      # يسبق كل شيء: بلا السر لا نشر، ونريد رسالة مفهومة لا فشلاً غامضاً
      - name: Check the access token secret is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty — add it under Settings → Environments → production (docs/DEPLOY.md)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # تشغيل ينتظر الموافقة يحجز concurrency، فإن جاءت بعده دفعة غيّرت الوظيفة صار يحمل نسخة أقدم من main:
      # لا يُنشر فوق الأحدث (التشغيل الأحدث معلّق خلفه). المسارات نفسها في on.push.paths، فدفعة لا تمسها لا تُسقطه.
      # إعادة التشغيل (المحاولة 2 فأكثر) هي طريق التراجع المقصود، فلا تُفحص.
      - name: Refuse a run older than main
        if: github.run_attempt == '1'
        run: |
          git fetch --no-tags --depth=1 origin main
          newer=$(git diff --name-only "$GITHUB_SHA" FETCH_HEAD -- supabase/functions/agent-run supabase/functions/_shared/effort-router supabase/config.toml .github/workflows/deploy-agent-run.yml)
          if [ -n "$newer" ]; then
            echo "::error::main has changed agent-run since this run's commit $GITHUB_SHA — nothing was deployed; approve the newest deploy-agent-run run instead (docs/DEPLOY.md)"
            echo "$newer"
            exit 1
          fi

      # بوابة agent-run من tests.yml على الملفات التي ستُنشر بعينها؛ السر ليس في بيئتها (الاختبارات تقرأ env)
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Type-check and test agent-run
        run: |
          deno check supabase/functions/agent-run/index.ts
          deno test --allow-read --allow-env supabase/functions/agent-run/ supabase/functions/_shared/effort-router/

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Record the live version
        id: before
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if ! body=$(curl --fail --silent --show-error --retry 3 --max-time 30 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/agent-run"); then
            echo "::error::cannot read agent-run from the Supabase Management API — token expired, revoked, or not scoped to this project with Edge Functions access (docs/DEPLOY.md)"
            exit 1
          fi
          version=$(jq -er '.version | numbers' <<<"$body")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "live agent-run before deploying: version $version, verify_jwt $(jq -r '.verify_jwt' <<<"$body")"

      # --no-verify-jwt: الوظيفة تتحقق من المتصل بنفسها، وpg_cron يناديها بسر من Vault بلا JWT (مثل config.toml).
      # --use-api: التجميع في Supabase نفسها بلا Docker؛ الأداة ترفع ملفات المستودع كما هي.
      - name: Deploy agent-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy agent-run --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      # نجاح الأمر لا يكفي: النسخة الحية تتقدم، وverify_jwt يبقى false في الرد نفسه وإلا رُفضت دورة المُجدوِل بـ 401.
      # ويعمل بعد كل محاولة نشر ولو فشلت: قد تنشر Supabase ثم يضيع ردها أو لا تقرؤه الأداة
      - name: Verify the live version advanced and verify_jwt is false
        if: ${{ !cancelled() && steps.before.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BEFORE: ${{ steps.before.outputs.version }}
        run: |
          for _ in 1 2 3 4 5 6; do
            if ! body=$(curl --fail --silent --show-error --retry 3 --max-time 30 \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/agent-run"); then
              echo "::error::cannot read agent-run from the Supabase Management API after deploying"
              exit 1
            fi
            after=$(jq -er '.version | numbers' <<<"$body")
            if [ "$after" -gt "$BEFORE" ]; then break; fi
            sleep 5
          done
          verify_jwt=$(jq -r '.verify_jwt' <<<"$body")
          echo "live agent-run: version $BEFORE -> $after, verify_jwt $verify_jwt, status $(jq -r '.status' <<<"$body")"
          if [ "$after" -le "$BEFORE" ]; then
            echo "::error::the live version did not advance ($BEFORE -> $after) — the deploy did not take effect"
            exit 1
          fi
          if [ "$verify_jwt" != "false" ]; then
            echo "::error::verify_jwt is $verify_jwt on the live agent-run — the pg_cron sweep is now rejected with 401 (docs/DEPLOY.md)"
            exit 1
          fi
