# حارس النسخة الاحتياطية: يفشل إذا مرت 36 ساعة بلا نسخة ليلية ناجحة، أو تعطّلت جدولة backup.
# فشل تشغيل مجدول يصل المالك إيميلاً من GitHub (صاحب آخر تعديل على الجدولة)، فلا يتوقف النسخ بصمت كما حدث مرة.
# لا سر هنا: يقرأ سجل تشغيلات المستودع نفسه برمز التشغيل (قراءة فقط). التفاصيل في docs/BACKUP.md.
name: backup-watch

on:
  schedule:
    # بعد موعد النسخة الفعلي (GitHub يشغّل جدولة 02:42 متأخرة، قرابة 09:00 بتوقيت UTC)
    - cron: '23 15 * * *'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: The nightly backup ran successfully in the last 36 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          state=$(gh api "repos/$REPO/actions/workflows/backup.yml" --jq '.state')
          if [ "$state" != "active" ]; then
            echo "::error::جدولة النسخة الاحتياطية متوقفة (الحالة: $state) — أعد تفعيلها من Actions ← backup ← Enable workflow"
            exit 1
          fi
          last=$(gh run list -R "$REPO" --workflow backup.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$last" ]; then
            echo "::error::لا توجد نسخة احتياطية ناجحة في سجل التشغيلات"
            exit 1
          fi
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          echo "آخر نسخة ناجحة: $last (قبل $age_h ساعة)"
          if [ "$age_h" -gt 36 ]; then
            echo "::error::مرت $age_h ساعة بلا نسخة احتياطية ناجحة — افتح Actions ← backup واقرأ آخر تشغيل"
            exit 1
          fi
