# نسخة احتياطية ليلية لقاعدة البيانات. الخطة المجانية في Supabase بلا نسخ احتياطي، والعمولات سجلات مالية.
# الناتج ملف SQL مضغوط ثم مشفّر بمفتاح age العام للمالك، يُرفع كـ artifact ويبقى تسعين يوماً.
# المستودع عام، فأي ملف غير مشفّر يُرفع هنا مكشوف للجميع. التفاصيل وخطوات الاستعادة في docs/BACKUP.md.
name: backup

on:
  schedule:
    - cron: '42 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      # يسبق كل شيء: بلا السر لا فائدة من التثبيت ولا من الرفع، ونريد رسالة مفهومة لا فشلاً غامضاً.
      - name: Check the database URL secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::add the SUPABASE_DB_URL secret — see docs/BACKUP.md"
            exit 1
          fi

      # عميل postgres بنفس إصدار الخادم الرئيسي (Postgres 17)؛ إصدار أقدم من pg_dump يرفض الاتصال.
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      # المفتاح العام ليس سرّاً ومكانه هنا؛ المفتاح الخاص الذي يفك التشفير عند المالك وحده خارج GitHub.
      - name: Dump, compress and encrypt the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: age1zrng4hp9mafqnc65q6999v3vt2qd0555ec6y9servrh9ml08j4mq2mjg84
        run: |
          file="mulaem-$(date -u +%F).sql"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --clean --if-exists -f "$file"
          gzip "$file"
          sudo apt-get install -y age
          age -r "$AGE_RECIPIENT" -o "$file.gz.age" "$file.gz"
          rm -f "$file.gz"
          ls -lh "$file.gz.age"

      # حاجز أخير قبل الرفع: إن بقي أي ملف SQL غير مشفّر فلا رفع أصلاً.
      - name: Refuse to upload unencrypted dumps
        run: |
          leftovers="$(find . -type f \( -name '*.sql' -o -name '*.sql.gz' \))"
          if [ -n "$leftovers" ]; then
            echo "::error::unencrypted dump found, refusing to upload: $leftovers"
            exit 1
          fi

      - name: Upload the encrypted backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: mulaem-db-backup-encrypted
          path: 'mulaem-*.sql.gz.age'
          retention-days: 90
          if-no-files-found: error
