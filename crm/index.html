<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملائم — إدارة العملاء</title>
    <link rel="icon" type="image/jpeg" href="../images/logo.jpg">

    <!-- خط عربي واحد للنظام كله: IBM Plex Sans Arabic (التصميم السادس يعود إليه وحده: أوضح في الجداول والأرقام) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- crm.css يستورد ../css/style.css أولاً ثم يضيف فروق /crm/ فقط -->
    <link rel="stylesheet" href="crm.css">
    <link rel="stylesheet" href="../css/theme.css">
    <!-- تصميم نظام العمل: قائمة جانبية فاتحة، وألوان هادئة، وصفحة «عملي اليوم» (crm/app.css) -->
    <link rel="stylesheet" href="app.css">
    <!-- التصميم الخامس «أسهل» (2026-10-22): بطاقات الجوال، وبحث العميل في القائمة الجانبية -->
    <link rel="stylesheet" href="easy.css">
    <!-- التصميم الخامس: ورق دافئ، شريط علوي، زر واحد في كل مكان -->
    <link rel="stylesheet" href="v5.css">
    <!-- استوديو البروشورات (2026-10-25): صفحات 16:9 بهوية ملائم، ثابتة الألوان في الوضعين، وطباعتها -->
    <link rel="stylesheet" href="brochure.css">
    <!-- التصميم السادس «الوسيط» (2026-10-23): حبر وورق، البحث السريع، أرقام الوسيط، أقسام الطلبات والمطابقات والعمولات. يُحمَّل آخر الكل -->
    <link rel="stylesheet" href="v6.css">
</head>

<body>
    <!-- أول ما يصله Tab: يتخطى الشريط العلوي إلى محتوى الصفحة (app.js: wireSkipLink) -->
    <button type="button" class="skip-link" id="skipLink">انتقل إلى المحتوى</button>
    <!-- يظهر حين ينقطع الإنترنت (app.js: wireOffline) -->
    <div class="offline-bar" id="offlineBar" role="status" hidden>لا يوجد اتصال بالإنترنت — ما تراه قد لا يكون محدّثاً، ولن يُحفظ شيء حتى يعود الاتصال.</div>

    <!-- تظهر حتى تُقرأ الجلسة، ثم تُخفى -->
    <div class="loading" id="bootScreen" style="padding-top:90px">جارٍ التحقق من الجلسة</div>

    <!-- شاشة الدخول: لا تظهر إلا إذا لم تكن هناك جلسة -->
    <div class="login-container crm-hidden" id="loginScreen">
        <div class="login-box">
            <img src="../images/logo.jpg" class="login-logo" alt="شعار النظام">
            <h1>نظام ملائم العقاري</h1>
            <p>إدارة العملاء</p>

            <div class="login-error crm-hidden" id="loginError"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" required placeholder="أدخل اسم المستخدم" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" required placeholder="أدخل كلمة المرور"
                        autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">دخول</button>
            </form>
        </div>
    </div>

    <!-- هيكل التطبيق -->
    <div class="app-container" id="appScreen">
        <!-- قائمة جانبية ثابتة على الكمبيوتر (يميناً)، وشريط علوي مضغوط على الجوال مع الشريط السفلي (app.js) -->
        <div class="shell">
            <aside class="side">
                <div class="side-brand">
                    <img src="../images/logo.jpg" class="side-logo" alt="شعار ملائم">
                    <div class="side-name">
                        <strong>ملائم العقارية</strong>
                        <span>إدارة العملاء</span>
                    </div>
                </div>

                <!-- البحث السريع من أي صفحة: عملاء وعقارات وصفحات (app.js يفتح به palette.js). الجوال له زر البحث في «عملي اليوم» -->
                <form class="side-search" id="sideSearch" role="search">
                    <input type="search" id="sideSearchBox" placeholder="ابحث عن عميل أو عقار…" aria-label="بحث سريع في العملاء والعقارات (Ctrl+K)" aria-keyshortcuts="Control+K" autocomplete="off">
                    <kbd class="side-search-kbd" aria-hidden="true">Ctrl K</kbd>
                </form>

                <nav class="crm-nav" id="crmNav" aria-label="القائمة الرئيسية"></nav>

                <div class="side-user">
                    <span class="user-badge" id="userBadge"></span>
                    <div class="side-user-actions">
                        <button class="theme-toggle" id="themeToggle" type="button" aria-label="تفعيل الوضع الليلي" title="الوضع الليلي">◐</button>
                        <button class="logout-btn" id="logoutBtn" type="button">تسجيل الخروج</button>
                    </div>
                </div>
            </aside>

            <main id="view" tabindex="-1"></main>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>
    <div class="notification" id="notification"></div>

    <!-- حارس الإقلاع: نص تقليدي (لا وحدة) يسبق كل ما سواه، حتى يلتقط فشل تحميل
         المكتبة أو الإعدادات نفسها، فلا يرى المستخدم شاشة بيضاء بلا تفسير. -->
    <script>
        (function () {
            var shown = false;
            function bootError(detail) {
                var boot = document.getElementById('bootScreen');
                // لا نلمس الشاشة بعد نجاح الإقلاع: التطبيق يخفيها بـ crm-hidden
                if (!boot || shown || boot.className.indexOf('crm-hidden') !== -1) return;
                shown = true;
                boot.className = 'crm-error';
                boot.style.cssText = 'margin:90px auto 0;max-width:640px';
                // صفحة مفتوحة من ملف على الجهاز (file://): المتصفح يمنع تحميل وحدات
                // JavaScript منها فيتوقف الإقلاع دائماً. رسالة صريحة برابط الموقع بدل config.js.
                if (location.protocol === 'file:') {
                    var site = 'https://dash.mulaem.sa/crm/';
                    boot.textContent = 'هذه نسخة محفوظة على الجهاز، والمتصفح لا يشغّل النظام منها. افتح النظام من رابط الموقع: ';
                    var link = document.createElement('a');
                    link.href = site + location.hash;
                    link.textContent = site;
                    link.dir = 'ltr';
                    boot.appendChild(link);
                    return;
                }
                boot.textContent = 'تعذّر تحميل الإعدادات أو المكتبة — راجع js/config.js';
                if (detail) {
                    var line = document.createElement('div');
                    line.className = 'crm-subtle';
                    line.style.marginTop = '8px';
                    line.textContent = String(detail);
                    boot.appendChild(line);
                }
            }
            window.onerror = function (message) { bootError(message); };
            // فشل تحميل ملف (المكتبة أو config.js) لا يمرّ على onerror، بل على
            // حدث error في طور الالتقاط على النافذة
            window.addEventListener('error', function (event) {
                if (event.target && event.target !== window && event.target.src) {
                    bootError('تعذّر تحميل: ' + event.target.src);
                }
            }, true);
            window.addEventListener('unhandledrejection', function (event) {
                var reason = event.reason;
                bootError(reason && reason.message ? reason.message : reason);
            });
        })();
    </script>

    <!-- نفس شبكة التوزيع المستخدمة في اللوحة القديمة، بإصدار مثبّت لا يتغيّر تحتنا -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
    <script src="../js/config.js"></script>
    <!-- بدون supabase-shim.js وبدون script.js: هذه الصفحة تتحدث إلى Supabase مباشرة -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
