# نبضة يومية تمنع Supabase من إيقاف المشروع على الخطة المجانية (يوقفه بعد سبعة أيام خمول).
# تستدعي الدالة public.keepalive() التي ترجع وقت الخادم ولا تقرأ أي جدول، بالمفتاح العام
# (publishable) المنشور أصلاً في js/config.js — لا حاجة لأي سر هنا.
#
# تنبيه: GitHub يعطّل المهام المجدولة في أي مستودع لا نشاط فيه ستين يوماً. إن هدأ المستودع هذه
# المدة فلن تعمل الجدولة تلقائياً، ويلزم إعادة تفعيلها يدوياً من تبويب Actions في GitHub.
name: keepalive

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the keepalive RPC
        run: |
          curl --fail --silent --show-error \
            -X POST 'https://niykzsspdehexphewlxa.supabase.co/rest/v1/rpc/keepalive' \
            -H 'apikey: sb_publishable_GUx3i6pNJE56TidkxaItMg_0zwRSaVi' \
            -H 'Authorization: Bearer sb_publishable_GUx3i6pNJE56TidkxaItMg_0zwRSaVi' \
            -H 'Content-Type: application/json' \
            -d '{}'
