# نشر وظيفة maqsam-link (صفحة «الربط مع مقسم») من المستودع نفسه: أداة Supabase ترفع ملفات main من النسخة المسحوبة كما هي.
# يبدأ فقط بدفعة إلى main تمس مجلد الوظيفة أو هذا الملف، ثم ينتظر موافقة المالك في بيئة production المحمية، وفيها وحدها
# السر SUPABASE_ACCESS_TOKEN نفسه الذي يستعمله deploy-agent-run: لا سر جديد ولا إعداد جديد.
# supabase/config.toml ليس من مساراته عمداً ولا يُعدَّل له: الوظيفة على الافتراضي verify_jwt = true، وأي تعديل فيه يوقظ
# deploy-agent-run بلا داعٍ. الإعداد والتراجع وما يُفعل إن تسرّب الرمز كما في docs/DEPLOY.md.
name: deploy-maqsam-link

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/maqsam-link/**'
      - '.github/workflows/deploy-maqsam-link.yml'

permissions:
  contents: read

# bash -eo pipefail: أول أمر يفشل يُسقط الخطوة
defaults:
  run:
    shell: bash

jobs:
  # قبل الموافقة وبلا أي سر: يلغي التشغيلات الأقدم التي ما زالت تنتظر موافقة المالك (لم يُنشر منها شيء)، فلا يبقى
  # أمامه إلا الأحدث، ويكتب بالعربي ما الذي سيُنشر. لا يوافق ولا يرفض شيئاً: الموافقة للمالك وحده من المتصفح.
  # لا يلمس تشغيلاً بدأ النشر فعلاً (in_progress)، ولا يلغي نفسه ولا ما بعده.
  gate:
    if: github.repository == 'mohammedalseari-design/mulaem-dash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel older runs still waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_number }}
        run: |
          for status in waiting pending queued; do
            gh run list -R "$REPO" --workflow deploy-maqsam-link.yml --status "$status" --limit 50 \
              --json databaseId,number --jq ".[] | select(.number < $THIS_RUN) | .databaseId" |
            while read -r id; do
              echo "إلغاء تشغيل أقدم ينتظر: $id"
              gh run cancel -R "$REPO" "$id" || true
            done
          done

      - name: What this run will deploy (Arabic summary)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          {
            echo "## ما الذي سيُنشر في الربط مع مقسم"
            echo ""
            echo "وافق على هذا التشغيل وحده؛ التشغيلات الأقدم المنتظرة أُلغيت تلقائياً."
            echo ""
            echo "إن كان تشغيل **migrate** ينتظر موافقتك أيضاً فوافق عليه أولاً: هذه الوظيفة تحتاج التحديث 041."
            echo ""
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              echo "### التغييرات منذ الدفعة السابقة"
              gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' || echo "- (تعذّرت قراءة القائمة)"
              echo ""
              echo "### ملفات الوظيفة التي تغيّرت"
              gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename | select(startswith("supabase/functions/maqsam-link/") or . == ".github/workflows/deploy-maqsam-link.yml") | "- " + .' || true
            else
              echo "تشغيل بلا دفعة سابقة معروفة (إعادة تشغيل للتراجع؟): يُنشر ما في $AFTER."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: gate
    if: github.repository == 'mohammedalseari-design/mulaem-dash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # نشر واحد في كل مرة، ولا يُقطع نشر بدأ (على مستوى هذا العمل، فيعمل gate في التشغيل الأحدث فوراً)
    concurrency:
      group: deploy-maqsam-link
      cancel-in-progress: false
    # البيئة المحمية: لا يبدأ العمل قبل موافقة المالك، والسر فيها لا في أسرار المستودع
    environment: production
    timeout-minutes: 20
    env:
      PROJECT_REF: niykzsspdehexphewlxa
      # لا قياس استخدام من أداة Supabase في عمل يحمل رمز النشر
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # تشغيل ينتظر الموافقة يحجز concurrency، فإن جاءت بعده دفعة غيّرت الوظيفة صار يحمل نسخة أقدم من main:
      # لا يُنشر فوق الأحدث (التشغيل الأحدث معلّق خلفه)، ويُتخطّى بلا فشل. المسارات نفسها في on.push.paths.
      # إعادة التشغيل (المحاولة 2 فأكثر) هي طريق التراجع المقصود، فلا تُفحص.
      - name: Skip a run older than main
        id: freshness
        if: github.run_attempt == '1'
        run: |
          git fetch --no-tags --depth=1 origin main
          newer=$(git diff --name-only "$GITHUB_SHA" FETCH_HEAD -- supabase/functions/maqsam-link .github/workflows/deploy-maqsam-link.yml)
          if [ -n "$newer" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main has changed maqsam-link since this run's commit $GITHUB_SHA — nothing was deployed; approve the newest deploy-maqsam-link run instead (docs/DEPLOY.md)"
            echo "لم يُنشر شيء: تغيّرت ملفات maqsam-link في main بعد هذا التشغيل. وافق على أحدث تشغيل deploy-maqsam-link ولا تُعِد تشغيل هذا التشغيل القديم." >> "$GITHUB_STEP_SUMMARY"
            echo "$newer"
          fi

      # بلا السر لا نشر، ونريد رسالة مفهومة لا فشلاً غامضاً
      - name: Check the access token secret is set
        if: steps.freshness.outputs.stale != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty — add it under Settings → Environments → production (docs/DEPLOY.md)"
            exit 1
          fi

      # فحص الأنواع واختبارات الوظيفة على الملفات التي ستُنشر بعينها؛ السر ليس في بيئتها (الاختبارات تقرأ env)
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: steps.freshness.outputs.stale != 'true'
        with:
          deno-version: 2.9.7

      - name: Type-check and test maqsam-link
        if: steps.freshness.outputs.stale != 'true'
        run: |
          deno check supabase/functions/maqsam-link/index.ts
          deno test --allow-read --allow-env supabase/functions/maqsam-link/

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.freshness.outputs.stale != 'true'
        with:
          version: 2.119.0

      # 404 في أول نشر فقط: الوظيفة لم توجد بعد، فنسختها الحية صفر. أي رد آخر غير 200 فشل مفهوم لا نشر أعمى.
      - name: Record the live version
        id: before
        if: steps.freshness.outputs.stale != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if ! code=$(curl --silent --show-error --retry 3 --max-time 30 --output "$RUNNER_TEMP/live.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/maqsam-link"); then
            echo "::error::cannot reach the Supabase Management API"
            exit 1
          fi
          case "$code" in
            200)
              version=$(jq -er '.version | numbers' "$RUNNER_TEMP/live.json")
              echo "live maqsam-link before deploying: version $version, verify_jwt $(jq -r '.verify_jwt' "$RUNNER_TEMP/live.json")"
              ;;
            404)
              version=0
              echo "maqsam-link does not exist yet: this is its first deploy"
              ;;
            *)
              echo "::error::cannot read maqsam-link from the Supabase Management API (HTTP $code) — token expired, revoked, or not scoped to this project with Edge Functions access (docs/DEPLOY.md)"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # بلا إعفاء من فحص JWT: الوظيفة لا يناديها مُجدوِل، والمنصة ترفض النداء المجهول قبل أن يصل إلى الكود، ثم يفحص الكود المدير.
      # --use-api: التجميع في Supabase نفسها بلا Docker؛ الأداة ترفع ملفات المستودع كما هي.
      - name: Deploy maqsam-link
        if: steps.freshness.outputs.stale != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy maqsam-link --project-ref "$PROJECT_REF" --use-api

      # نجاح الأمر لا يكفي: النسخة الحية تتقدم، والوظيفة ACTIVE، وverify_jwt يبقى true في الرد نفسه.
      # ويعمل بعد كل محاولة نشر ولو فشلت: قد تنشر Supabase ثم يضيع ردها أو لا تقرؤه الأداة. وبعد أول نشر قد يتأخر ظهورها، فـ 404 تُعاد.
      - name: Verify the function is live and verify_jwt is true
        if: ${{ !cancelled() && steps.before.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BEFORE: ${{ steps.before.outputs.version }}
        run: |
          after=0
          for _ in 1 2 3 4 5 6; do
            if ! code=$(curl --silent --show-error --retry 3 --max-time 30 --output "$RUNNER_TEMP/live.json" --write-out '%{http_code}' \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/maqsam-link"); then
              echo "::error::cannot reach the Supabase Management API after deploying"
              exit 1
            fi
            if [ "$code" = "200" ]; then
              after=$(jq -er '.version | numbers' "$RUNNER_TEMP/live.json")
              if [ "$after" -gt "$BEFORE" ]; then break; fi
            elif [ "$code" != "404" ]; then
              echo "::error::cannot read maqsam-link from the Supabase Management API after deploying (HTTP $code)"
              exit 1
            fi
            sleep 5
          done
          if [ "$after" -le "$BEFORE" ]; then
            echo "::error::the live version did not advance ($BEFORE -> $after) — the deploy did not take effect"
            exit 1
          fi
          verify_jwt=$(jq -r '.verify_jwt' "$RUNNER_TEMP/live.json")
          status=$(jq -r '.status' "$RUNNER_TEMP/live.json")
          echo "live maqsam-link: version $BEFORE -> $after, verify_jwt $verify_jwt, status $status"
          if [ "$verify_jwt" != "true" ]; then
            echo "::error::verify_jwt is $verify_jwt on the live maqsam-link — the platform must reject anonymous calls"
            exit 1
          fi
          if [ "$status" != "ACTIVE" ]; then
            echo "::error::the live maqsam-link is $status, not ACTIVE"
            exit 1
          fi
          echo "✓ وظيفة الربط مع مقسم منشورة ومتحقق منها: النسخة $after، والمنصة ترفض النداء المجهول." >> "$GITHUB_STEP_SUMMARY"
